// ══════════════════════════════════════════════
async function existeGuia(url) {
    try {
        const res = await fetch(url, { method: 'HEAD' });
        return res.ok;
    } catch {
        return false;
    }
}

    const container = document.getElementById('accordion-container');
    if (!container) return;

    const periodos = [
        { key: 'periodo1', label: '📅 Período 1', color: '#3DBE8C', num: 1 },
        { key: 'periodo2', label: '📅 Período 2', color: '#1A9BAB', num: 2 },
        { key: 'periodo3', label: '📅 Período 3', color: '#7C3AED', num: 3 },
        { key: 'periodo4', label: '📅 Período 4', color: '#F4872B', num: 4 },
    ];

    const base = GUIAS_BASE[grado] || '../periodos/';

    for (const periodo of periodos) {
        const semanas = cfg.periodos[periodo.key];
        if (!semanas) continue;

        let semanasHTML = '';

        for (const s of semanas) {

            // ── Construir ruta de la guía ──────────────────
            const rutaGuia = `${base}periodo${periodo.num}/semana${s.semana}.html`;

            // ── Verificar si existe ────────────────────────
            const guiaDisponible = await existeGuia(rutaGuia);

            // ── Botón dinámico (igual que matematicas.html) ─
            const btnGuia = guiaDisponible
                ? `<a href="${rutaGuia}" class="btn-ver-guia" target="_blank">

                       title="Guía en construcción 🚧">

            if (s.actividad) {
                semanasHTML += `
                    <div class="week-container week-eval">
                        <div class="week-header-row">
                            <h3>⭐ Semana ${s.semana} · ${s.tema}</h3>

                        <p>${s.actividad}</p>
                    </div>
                `;
            } else {
                semanasHTML += `
                    <div class="week-container">
                        <div class="week-header-row">
                            <h3>📌 Semana ${s.semana} · ${s.tema}</h3>
                            ${btnGuia}
                        </div>
                        <div class="week-detail">
                            <span class="week-tag tag-desempeno">🎯 Desempeño</span>
                            <p>${s.desempeno}</p>
                        </div>
                        <div class="week-detail">
                            <span class="week-tag tag-objeto">📚 Objeto de Aprendizaje</span>
                            <p>${s.objeto}</p>
                        </div>
                        <div class="week-detail">
                            <span class="week-tag tag-ciudadana">🤝 Competencia Ciudadana</span>
                            <p>${s.ciudadana}</p>
                        </div>
                    </div>
                `;
            }
        }

        const item = document.createElement('div');
        item.className = 'accordion-item';
        item.innerHTML = `
            <button class="accordion-header"
                style="--periodo-color: ${periodo.color}">
                <span>${periodo.label}</span>
                <span class="accordion-icon">+</span>
            </button>
            <div class="accordion-content">
                ${semanasHTML}
            </div>
        `;
        container.appendChild(item);
    }

    initAccordion();
}

    // ══════════════════════════════════════════════
    // INIT
    // ══════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
        // generarAcordeon es async → devuelve Promise
        // initSequentialAnimations se llama después de que
        // el acordeón esté completamente construido
        generarAcordeon().then(() => {
            initSequentialAnimations();
        });
    });

    </script>
