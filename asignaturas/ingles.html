    // ══════════════════════════════════════════════
    // RUTAS BASE DE GUÍAS POR NIVEL
    // ══════════════════════════════════════════════
    const GUIAS_BASE = {
        basica: '../guias/ingles/grados6-7',
        media:  '../guias/ingles/grados8-9'
    };

    // ══════════════════════════════════════════════
    // CONFIGURACIÓN POR NIVEL
    // ══════════════════════════════════════════════
    const configNivel = {
        basica: {
            badge:    "🌎 Básica Secundaria · Grados 6 y 7",
            subtitle: "Grados 6 · 7 · Competencias Comunicativas en Inglés",
            desc:     "Lingüística, Pragmática y Sociolingüística: información personal, rutinas, gustos y expresiones cotidianas.",
            icon:     "🌎",
            color:    "linear-gradient(135deg, #1A9BAB, #3DBE8C)",
            grados:   ['grado6', 'grado7'],
            labels:   ['Grado 6°', 'Grado 7°']
        },
        media: {
            badge:    "🚀 Media · Grados 8 y 9",
            subtitle: "Grados 8 · 9 · Inglés Avanzado e Integrado",
            desc:     "Textos narrativos, argumentativos y descriptivos: opiniones, exposiciones y proyectos comunicativos de impacto.",
            icon:     "🚀",
            color:    "linear-gradient(135deg, #7C3AED, #4F46E5)",
            grados:   ['grado8', 'grado9'],
            labels:   ['Grado 8°', 'Grado 9°']
        }
    };

    // ══════════════════════════════════════════════
    // DETECTAR NIVEL DESDE URL
    // ══════════════════════════════════════════════
    const params = new URLSearchParams(window.location.search);
    const nivel  = params.get('nivel') || 'basica';
    const cfg    = configNivel[nivel] || configNivel.basica;

    // Actualizar interfaz
    document.getElementById('header-sub').textContent          = cfg.subtitle;
    document.getElementById('level-badge').textContent         = cfg.badge;
    document.getElementById('subject-icon').textContent        = cfg.icon;
    document.getElementById('subject-desc').textContent        = cfg.desc;
    document.getElementById('level-badge').style.background    = cfg.color;

    if (nivel === 'media') {
        document.getElementById('header-icon').textContent = '🚀';
    }

    // ══════════════════════════════════════════════
    // VERIFICAR SI EXISTE UNA GUÍA
    // ══════════════════════════════════════════════
    async function existeGuia(url) {
    if (window.location.protocol === 'file:') {
        // En modo local, asumimos que el archivo existe si la ruta es válida
        // Esto es un hack para que funcione sin internet
        return true;
        }
        try {
            const res = await fetch(url, { method: 'HEAD' });
            return res.ok;
        } catch {
            return false;
        }
    }
    // ══════════════════════════════════════════════
    // SELECTOR DE GRADO
    // ══════════════════════════════════════════════
    let gradoActual = cfg.grados[0];

    function generarSelector() {
        const selector = document.getElementById('grade-selector');
        if (!selector) return;
        selector.innerHTML = '';

        cfg.grados.forEach((grado, idx) => {
            const btn = document.createElement('button');
            btn.className     = `grade-btn${idx === 0 ? ' active' : ''}`;
            btn.dataset.grado = grado;
            btn.textContent   = cfg.labels[idx];
            btn.addEventListener('click', () => {
                document.querySelectorAll('.grade-btn')
                        .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gradoActual = grado;
                generarAcordeon(gradoActual);
                if (navigator.vibrate) navigator.vibrate(20);
            });
            selector.appendChild(btn);
        });
    }

    // ══════════════════════════════════════════════
    // GENERAR ACORDEÓN CON MALLA OFICIAL Y BOTÓN GUÍA
    // ══════════════════════════════════════════════
    const periodosMeta = [
        { key: 'periodo1', label: '📅 Período 1', color: '#3DBE8C' },
        { key: 'periodo2', label: '📅 Período 2', color: '#1A9BAB' },
        { key: 'periodo3', label: '📅 Período 3', color: '#7C3AED' },
        { key: 'periodo4', label: '📅 Período 4', color: '#F4872B' }
    ];

    async function generarAcordeon(grado) {
        const container = document.getElementById('accordion-container');
        if (!container) return;
        container.innerHTML = '';

        const baseGuia = GUIAS_BASE[nivel];

        for (let idx = 0; idx < periodosMeta.length; idx++) {
            const periodo   = periodosMeta[idx];
            const semanas   = malla[grado][periodo.key];
            let semanasHTML = '';

            for (let s of semanas) {
                const numPeriodo = idx + 1;
                const rutaGuia   =
                    `${baseGuia}/periodo${numPeriodo}/semana${s.semana}.html`;
                const hayGuia    = await existeGuia(rutaGuia);

                const btnGuia = hayGuia ? `
                    <a href="${rutaGuia}"
                       class="btn-guia"
                       title="Ver guía de trabajo">
                        📄 Ver Guía
                    </a>` : '';

                // Semana de evaluación (solo tiene 'actividad')
                if (s.actividad) {
                    semanasHTML += `
                        <div class="week-container week-eval">
                            <div class="week-header-row">
                                <h3>⭐ Semana ${s.semana} · ${s.tema}</h3>
                                ${btnGuia}
                            </div>
                            <p>${s.actividad}</p>
                        </div>
                    `;
                } else {
                    semanasHTML += `
                        <div class="week-container">
                            <div class="week-header-row">
                                <h3>📌 Semana ${s.semana} · ${s.tema}</h3>
                                ${btnGuia}
                            </div>
                            <div class="week-detail">
                                <span class="week-tag tag-desempeno">🎯 Desempeño</span>
                                <p>${s.desempeno}</p>
                            </div>
                            <div class="week-detail">
                                <span class="week-tag tag-objeto">📚 Objeto de Aprendizaje</span>
                                <p>${s.objeto}</p>
                            </div>
                            <div class="week-detail">
                                <span class="week-tag tag-ciudadana">🤝 Competencia Ciudadana</span>
                                <p>${s.ciudadana}</p>
                            </div>
                        </div>
                    `;
                }
            }

            const item = document.createElement('div');
            item.className = 'accordion-item';
            item.innerHTML = `
                <button class="accordion-header"
                        style="--periodo-color: ${periodo.color}">
                    <span>${periodo.label}</span>
                    <span class="accordion-icon">+</span>
                </button>
                <div class="accordion-content">
                    ${semanasHTML}
                </div>
            `;
            container.appendChild(item);
        }

        initAccordion();
    }

    // ══════════════════════════════════════════════
    // INIT GLOBAL
    // ══════════════════════════════════════════════
    document.addEventListener('DOMContentLoaded', () => {
        generarSelector();
        generarAcordeon(gradoActual);
        initSequentialAnimations();
    });

    </script>

        .week-detail { margin-top: 10px; }

        /* Responsivo móvil */

            .week-header-row {
                flex-direction: column;
                align-items: stretch;
            }

            .btn-guia {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
