<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras Matemáticas - Profe Nelson</title>
    <style>
        :root { --bg: #f4f6f7; --grid-bg: #2c3e50; --cell-bg: #ecf0f1; --sel: #f1c40f; --found: #27ae60; --txt: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--txt); text-align: center; margin: 0; padding: 20px; }
        h1 { margin: 10px 0; color: var(--grid-bg); }
        p { color: #7f8c8d; margin-bottom: 20px; }
        .container { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        #grid { --grid-size: 12; display: grid; grid-template-columns: repeat(var(--grid-size), 35px); gap: 3px; background: var(--grid-bg); padding: 8px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .cell { width: 35px; height: 35px; background: var(--cell-bg); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; cursor: pointer; user-select: none; border-radius: 4px; transition: all 0.1s; }
        .cell:hover { background: #bdc3c7; }
        .cell.selected { background: var(--sel); color: white; transform: scale(1.1); box-shadow: 0 0 8px var(--sel); }
        .cell.found { background: var(--found); color: white; cursor: default; animation: pop 0.3s ease; }
        #words { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); min-width: 200px; text-align: left; }
        #words h3 { margin-top: 0; border-bottom: 2px solid var(--grid-bg); padding-bottom: 10px; }
        .word { padding: 8px; margin: 5px 0; background: #f8f9fa; border-radius: 4px; font-weight: 500; transition: all 0.3s; }
        .word.found { color: white; text-decoration: line-through; transform: translateX(5px); }
        .status { margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-weight: 600; background: #eaf2ff; color: #1d4f91; min-height: 20px; }
        .status.error { background: #fdecea; color: #9c2b2b; }
        .status.success { background: #eafaf1; color: #1d6f3d; }
        .remaining { margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #fff5d6; color: #7a5d00; font-weight: 700; }
        .reset-btn { margin-top: 12px; padding: 10px 16px; border: none; border-radius: 8px; background: #2c3e50; color: white; font-weight: 700; cursor: pointer; }
        .reset-btn:hover { background: #1f2d3d; }
        #celebration-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; opacity: 0; transition: opacity 0.3s ease; }
        body.celebrating #celebration-canvas { opacity: 1; }
        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 600px) { .cell { width: 28px; height: 28px; font-size: 0.9rem; } #grid { grid-template-columns: repeat(var(--grid-size), 28px); } }
    </style>
</head>
<body>
    <h1>🧮 Sopa de Letras Matemáticas</h1>
    <p>Haz clic en la <strong>primera</strong> y luego en la <strong>última</strong> letra de la palabra</p>
    <div class="container">
        <div>
            <div id="grid"></div>
            <div id="status" class="status">Selecciona la primera letra de la palabra.</div>
            <div id="remaining" class="remaining">Palabras faltantes: 10</div>
            <button id="reset-btn" class="reset-btn" type="button">Reiniciar juego</button>
        </div>
        <div id="words">
            <h3>Palabras:</h3>
            <div id="word-list"></div>
        </div>
    </div>
    <canvas id="celebration-canvas"></canvas>

    <script>
        const words = ["SUMA", "RESTA", "MULTIPLICACION", "DIVISION", "FRACCION", "GEOMETRIA", "ANGULO", "CUADRADO", "TRIANGULO", "CIRCULO", "TRACCION"];
        const size = Math.max(15, ...words.map(word => word.length + 2));
        const foundColors = ["#ef476f", "#f4a261", "#06d6a0", "#118ab2", "#8338ec", "#ff006e", "#ffbe0b", "#fb8500", "#00bbf9", "#38b000", "#9b5de5"];
        const gridEl = document.getElementById("grid");
        const statusEl = document.getElementById("status");
        const remainingEl = document.getElementById("remaining");
        const resetBtn = document.getElementById("reset-btn");
        const celebrationCanvas = document.getElementById("celebration-canvas");
        const celebrationCtx = celebrationCanvas.getContext("2d");
        let celebrationFrame = null;
        let celebrationParticles = [];
        let isCelebrating = false;
        let soundCtx = null;
        gridEl.style.setProperty("--grid-size", size);

        function normalizeWord(word) {
            return word.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
        }

        function playFoundSound() {
            const AudioCtor = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtor) return;

            if (!soundCtx) {
                soundCtx = new AudioCtor();
            }

            const oscillator = soundCtx.createOscillator();
            const gainNode = soundCtx.createGain();
            const now = soundCtx.currentTime;

            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(660, now);
            oscillator.frequency.exponentialRampToValueAtTime(990, now + 0.12);

            gainNode.gain.setValueAtTime(0.0001, now);
            gainNode.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);

            oscillator.connect(gainNode);
            gainNode.connect(soundCtx.destination);
            oscillator.start(now);
            oscillator.stop(now + 0.28);
        }

        function updateRemainingWords() {
            const remaining = words.filter(word => !found.has(word)).length;
            remainingEl.textContent = `Palabras faltantes: ${remaining}`;
        }

        function setStatus(message, isError = false) {
            statusEl.textContent = message;
            statusEl.classList.toggle("error", isError);
            statusEl.classList.toggle("success", !isError && message.includes("encontrada"));
            updateRemainingWords();
        }

        function resizeCelebrationCanvas() {
            const dpr = window.devicePixelRatio || 1;
            celebrationCanvas.width = window.innerWidth * dpr;
            celebrationCanvas.height = window.innerHeight * dpr;
            celebrationCanvas.style.width = `${window.innerWidth}px`;
            celebrationCanvas.style.height = `${window.innerHeight}px`;
            celebrationCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function startCelebration() {
            if (isCelebrating) return;
            isCelebrating = true;
            document.body.classList.add("celebrating");
            celebrationParticles = Array.from({ length: 180 }, () => ({
                x: Math.random() * window.innerWidth,
                y: -20 - Math.random() * window.innerHeight * 0.4,
                length: 28 + Math.random() * 70,
                width: 4 + Math.random() * 6,
                color: ["#ff4d4d", "#ffd93d", "#4cd964", "#4dabf7", "#9b5de5", "#f15bb5"][Math.floor(Math.random() * 6)],
                speed: 2 + Math.random() * 4,
                sway: (Math.random() - 0.5) * 1.8,
                angle: Math.random() * Math.PI,
                phase: Math.random() * Math.PI * 2
            }));

            const animate = () => {
                celebrationCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                celebrationParticles.forEach((p) => {
                    p.y += p.speed;
                    p.x += Math.sin((p.y + p.phase) * 0.08) * p.sway + p.sway * 0.3;
                    p.angle += 0.03;

                    celebrationCtx.save();
                    celebrationCtx.translate(p.x, p.y);
                    celebrationCtx.rotate(p.angle);
                    celebrationCtx.fillStyle = p.color;
                    celebrationCtx.fillRect(0, 0, p.length, p.width);
                    celebrationCtx.restore();
                });

                if (isCelebrating) {
                    celebrationFrame = requestAnimationFrame(animate);
                }
            };

            cancelAnimationFrame(celebrationFrame);
            celebrationFrame = requestAnimationFrame(animate);

            setTimeout(() => {
                isCelebrating = false;
                document.body.classList.remove("celebrating");
                cancelAnimationFrame(celebrationFrame);
                celebrationCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            }, 5000);
        }

        window.addEventListener("resize", resizeCelebrationCanvas);
        resizeCelebrationCanvas();

        function buildBoard() {
            let grid = Array(size).fill(null).map(() => Array(size).fill(""));
            const placedWords = [];

            function cellKey(r, c) {
                return `${r},${c}`;
            }

            function getPathCells(startPos, endPos) {
                const dr = endPos.r - startPos.r;
                const dc = endPos.c - startPos.c;
                const steps = Math.max(Math.abs(dr), Math.abs(dc));

                if (steps === 0) return [{ r: startPos.r, c: startPos.c }];
                if (dr === 0 || dc === 0 || Math.abs(dr) === Math.abs(dc)) {
                    const stepR = dr === 0 ? 0 : dr / steps;
                    const stepC = dc === 0 ? 0 : dc / steps;
                    const cells = [];
                    for (let i = 0; i <= steps; i++) {
                        cells.push({ r: startPos.r + i * stepR, c: startPos.c + i * stepC });
                    }
                    return cells;
                }
                return null;
            }

            const dirs = [[0,1], [1,0], [1,1], [1,-1]];
            words.forEach(word => {
                let placed = false;
                let attempts = 0;
                while (!placed && attempts < 5000) {
                    const [dr, dc] = dirs[Math.floor(Math.random() * dirs.length)];
                    const r = Math.floor(Math.random() * size);
                    const c = Math.floor(Math.random() * size);
                    let ok = true;
                    const cells = [];

                    for (let i = 0; i < word.length; i++) {
                        const nr = r + i * dr, nc = c + i * dc;
                        if (nr < 0 || nr >= size || nc < 0 || nc >= size || (grid[nr][nc] && grid[nr][nc] !== word[i])) {
                            ok = false;
                            break;
                        }
                        cells.push({ r: nr, c: nc });
                    }

                    if (ok) {
                        for (let i = 0; i < word.length; i++) {
                            const nr = r + i * dr;
                            const nc = c + i * dc;
                            grid[nr][nc] = word[i];
                        }
                        placedWords.push({ word, cells });
                        placed = true;
                    }
                    attempts++;
                }
            });

            const chars = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!grid[r][c]) grid[r][c] = chars[Math.floor(Math.random() * chars.length)];
                }
            }

            return { grid, placedWords, getPathCells, cellKey };
        }

        let board = buildBoard();
        let grid = board.grid;
        let placedWords = board.placedWords;
        let found = new Set();
        let start = null;

        function getWordFromPath(cells) {
            const letters = cells.map(pos => grid[pos.r][pos.c]).join("");
            const reverse = letters.split("").reverse().join("");
            const lettersKey = normalizeWord(letters);
            const reverseKey = normalizeWord(reverse);

            const exactWord = words.find(w => {
                if (found.has(w) || w.length !== cells.length) return false;
                return normalizeWord(w) === lettersKey || normalizeWord(w) === reverseKey;
            });

            if (exactWord) return exactWord;

            const longerWord = placedWords.find(info => {
                if (info.word.length <= cells.length) return false;
                const selectedSet = new Set(cells.map(pos => board.cellKey(pos.r, pos.c)));
                return info.cells.every(pos => selectedSet.has(board.cellKey(pos.r, pos.c)));
            });

            return longerWord ? null : null;
        }

        const listEl = document.getElementById("word-list");
        words.forEach(w => listEl.innerHTML += `<div class="word" id="w-${w}">${w}</div>`);

        for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.textContent = grid[r][c];
                cell.dataset.r = r;
                cell.dataset.c = c;
                cell.onclick = function(event) { handleClick(this, r, c, event); };
                gridEl.appendChild(cell);
            }
        }

        function handleClick(cell, r, c, event) {
            if (event) event.preventDefault();

            if (!start) {
                start = { r, c, cell };
                cell.classList.add("selected");
                setStatus("Selecciona la última letra para completar la palabra.");
                return;
            }

            if (start.r === r && start.c === c) {
                start.cell.classList.remove("selected");
                start = null;
                setStatus("Selecciona otra letra para intentar una palabra.");
                return;
            }

            const cells = board.getPathCells({ r: start.r, c: start.c }, { r, c });
            if (!cells) {
                if (start && start.cell) start.cell.classList.remove("selected");
                start = null;
                setStatus("La palabra debe ir en línea recta o en diagonal.", true);
                return;
            }

            const match = getWordFromPath(cells);
            const isIncompleteOrWrong = !match;

            if (isIncompleteOrWrong) {
                if (start && start.cell) start.cell.classList.remove("selected");
                start = null;
                setStatus("No es una palabra completa válida. Debes seleccionar la palabra completa.", true);
                return;
            }

            found.add(match);
            const colorIndex = words.indexOf(match) % foundColors.length;
            const color = foundColors[colorIndex];

            cells.forEach(pos => {
                const idx = pos.r * size + pos.c;
                const cellEl = gridEl.children[idx];
                if (cellEl && !cellEl.classList.contains("found")) {
                    cellEl.classList.add("found");
                    cellEl.style.background = color;
                    cellEl.style.boxShadow = `0 0 8px ${color}`;
                }
            });

            const wordEl = document.getElementById(`w-${match}`);
            if (wordEl && !wordEl.classList.contains("found")) {
                wordEl.classList.add("found");
                wordEl.style.background = color;
                wordEl.style.color = "white";
            }

            playFoundSound();
            setStatus(`¡Palabra encontrada: ${match}!`, false);

            if (start && start.cell) start.cell.classList.remove("selected");
            start = null;
            updateRemainingWords();

            if (found.size === words.length) {
                startCelebration();
                setTimeout(() => alert("¡Felicidades, Profe Nelson! 🎉 Has completado el desafío."), 200);
            }
        }

        resetBtn.addEventListener("click", () => {
            found.clear();
            start = null;
            gridEl.innerHTML = "";
            listEl.innerHTML = "";
            board = buildBoard();
            grid = board.grid;
            placedWords = board.placedWords;
            words.forEach(w => listEl.innerHTML += `<div class="word" id="w-${w}">${w}</div>`);

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.createElement("div");
                    cell.className = "cell";
                    cell.textContent = grid[r][c];
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.onclick = function(event) { handleClick(this, r, c, event); };
                    gridEl.appendChild(cell);
                }
            }

            updateRemainingWords();
            setStatus("Nuevo tablero listo. Selecciona la primera letra.");
        });
    </script>
</body>
</html>
